<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; }
    .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    img { max-width: 90vw; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="container" style="flex-direction: row; gap: 40px;">
    <img src="1111.jpg" alt="" style="max-width: 30vw; height: auto;">
    <div style="display: flex; flex-direction: column; gap: 20px; align-items: center;">
      <img src="2222.png" alt="" style="max-width: 30vw; height: auto;">
      <img src="3333.png" alt="" style="max-width: 30vw; height: auto;">
    </div>
  </div>
</body>
</html>
